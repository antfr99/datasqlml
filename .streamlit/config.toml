[theme]
# Base stays "light" on purpose: this is what makes st.dataframe / st.table grids
# render with a light background + dark text (readable), instead of pure white.
# Everything else in the app (sidebar, headers, buttons, metrics) is forced dark
# via the custom CSS injected in imdb_app.py, which sits visually on top of this.
base = "light"
primaryColor = "#E3A857"
backgroundColor = "#E4E6EA"
secondaryBackgroundColor = "#D6D9DE"
textColor = "#1B2029"
font = "sans serif"
