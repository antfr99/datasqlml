name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn joblib supabase pytest

      - name: Syntax-check the Streamlit app
        run: python -m py_compile movie_quiz.py

      - name: Syntax-check the scripts
        run: python -m py_compile scripts/refresh_live_ratings.py scripts/train_model.py

      - name: Run unit tests
        run: pytest tests/ -v
